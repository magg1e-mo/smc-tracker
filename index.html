<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SMC Tracker">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1EC">
<title>SMC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EEF1EC; --panel:#FAFBF8; --ink:#1B2430; --muted:#5E6B78; --line:#D3D9D2;
--bull:#1F8A70; --bull-soft:#D6ECE4; --miss:#B9C1C8; --gold:#A87A12; --gold-soft:#F3E7C6; --danger:#B4452F;
--bar:rgba(250,251,248,.94); --scrim:rgba(20,26,33,.38);
--display:"Kanit",system-ui,sans-serif;
--body:"Kanit","Noto Sans Thai",-apple-system,system-ui,sans-serif;
--tabh:62px;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#141A21; --panel:#1C242D; --ink:#E6EBEF; --muted:#9AA7B3; --line:#2E3A46;
--bull:#3DBE96; --bull-soft:#173A31; --miss:#3C4955; --gold:#E0B44C; --gold-soft:#3A3120; --danger:#E07A63;
--bar:rgba(28,36,45,.94); --scrim:rgba(0,0,0,.55);
}
}
:root[data-theme="dark"]{
--bg:#141A21; --panel:#1C242D; --ink:#E6EBEF; --muted:#9AA7B3; --line:#2E3A46;
--bull:#3DBE96; --bull-soft:#173A31; --miss:#3C4955; --gold:#E0B44C; --gold-soft:#3A3120; --danger:#E07A63;
--bar:rgba(28,36,45,.94); --scrim:rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
button,input,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{max-width:100%}
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:430px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:431px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.45rem;font-weight:700}
.streak{display:flex;align-items:baseline;gap:6px}
.streak b{font-family:var(--display);font-size:2.1rem;line-height:1;color:var(--bull);font-weight:700}
.streak span{color:var(--muted);font-size:.8rem;line-height:1.2;white-space:nowrap}
.streak.zero b{color:var(--miss)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
.view{display:none;padding:0 14px}
.view.active{display:block}
.block{margin-top:16px}
.block>h2{font-size:1.05rem;font-weight:600;margin:0 4px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.chart{padding:12px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;padding:2px 2px 0}
.legend{color:var(--muted);font-size:.8rem;margin:8px 2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat strong{display:block;font-family:var(--display);font-size:1.3rem}
.stat span{color:var(--muted);font-size:.8rem}
.today-state{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:.92rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--miss);flex:none}
.done .dot{background:var(--bull)}
label,.lbl{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],textarea{
width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;-webkit-appearance:none;appearance:none
}
textarea{resize:none;min-height:110px}
.picker{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;text-align:left}
.picker svg{flex:none;color:var(--muted)}
.lines input{margin-bottom:8px}
.row{display:flex;gap:10px}
.row>.grow{flex:1;min-width:0}
.row>.narrow{flex:0 0 96px}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;background:var(--bull);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block-btn{width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{min-height:44px;font-size:.92rem;padding:0 14px}
.hint{color:var(--muted);font-size:.82rem;margin-top:8px;text-align:center}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:44px;font-size:.88rem}
.chip.on{border-color:var(--bull);background:var(--bull-soft)}
.chip .ck{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted)}
.chip.watched .ck{background:var(--bull);border-color:var(--bull)}
.chip .open{margin-left:auto;color:var(--bull);font-size:.82rem;flex:none}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.progress i{display:block;height:100%;background:var(--bull);border-radius:99px}
ol.topics,.pick-list{list-style:none;padding:0;margin:0}
.topic{border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic-head,.pick-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 2px;min-height:58px;text-align:left}
.pick-list{margin-top:8px}
.pick-list li+li .pick-row{border-top:1px solid var(--line)}
.pick-row.on .t-title{color:var(--bull);font-weight:600}
.pick-row svg{flex:none;color:var(--bull)}
.num{font-family:var(--display);font-weight:600;width:2ch;color:var(--muted);flex:none;text-align:right}
.is-done .num{color:var(--bull)}
.is-learning .num{color:var(--gold)}
.t-main{flex:1;min-width:0}
.t-title{display:block;font-weight:500;font-size:.98rem}
.is-done .t-title{color:var(--muted)}
.t-meta{display:block;font-size:.78rem;color:var(--muted)}
.is-learning .t-meta{color:var(--gold)}
.is-done .t-meta{color:var(--bull)}
.chev{color:var(--muted);flex:none;font-size:1.2rem}
.add-topic{display:flex;gap:8px;margin-top:12px}
.add-topic input{flex:1;min-width:0}
.day{margin-top:18px}
.day:first-child{margin-top:0}
.day h3{font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.entry{border-left:3px solid var(--bull);padding:2px 0 2px 12px;margin-bottom:14px}
.entry .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.entry ol{margin:4px 0 0;padding-left:1.2em;font-size:.95rem}
.entry .q{margin-top:6px;font-size:.88rem;color:var(--gold)}
.entry a{color:var(--bull);word-break:break-all;font-size:.88rem}
.x{background:none;border:0;color:var(--muted);min-width:44px;min-height:44px;font-size:1.25rem;margin-right:-10px}
.empty{color:var(--muted);text-align:center;padding:22px 6px}
.sync{font-size:.78rem;color:var(--muted);margin:22px 8px 0;text-align:center}
.tabs{flex:none;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.75rem}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--bull);font-weight:600}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--panel);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .26s ease;visibility:hidden}
.sheet.show{transform:translateY(0);visibility:visible}
.grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:1.15rem;font-weight:600;padding-right:44px}
.sheet .close{position:absolute;top:10px;right:10px}
.sheet .status{font-size:.82rem;color:var(--muted);margin-top:4px}
.links{margin:0;padding:0;list-style:none}
.links li{display:flex;gap:6px;align-items:center;font-size:.92rem;border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a,.links span{flex:1;min-width:0;word-break:break-all;padding:8px 0}
.links a{color:var(--bull)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.dlg-wrap{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:24px}
.dlg-wrap.show{display:flex}
.dlg{background:var(--panel);border-radius:18px;padding:20px;width:100%;max-width:320px}
.dlg p{margin:0 0 16px}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:absolute;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);z-index:40;
background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;font-size:.92rem;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast,.sheet,.scrim{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="scroll" id="scroll">
<header class="top">
<h1>ตั้งใจหน่อยแม็กกี้ !</h1>
<div class="streak" id="streak"><b>0</b><span>วัน<br>ติดต่อกัน</span></div>
</header>
<main class="view active" id="v-today">
<div class="panel chart">
<svg id="candles" viewBox="0 0 360 130" role="img" aria-label="กราฟการเรียน 30 วันล่าสุด"></svg>
<div class="chart-foot"><span id="chartStart"></span><span>วันนี้</span></div>
</div>
<p class="legend">แท่งเขียว = เรียนและสรุปแล้ว ขีดเทา = วันที่หายไป</p>
<div class="stats" id="stats"></div>
<div class="block">
<h2>บันทึกวันนี้</h2>
<div class="panel">
<div class="today-state" id="todayState"><span class="dot"></span><span></span></div>
<div class="lbl" id="topicLbl">หัวข้อ</div>
<button type="button" class="picker" id="topicBtn" aria-labelledby="topicLbl topicBtnText" aria-haspopup="dialog">
<span id="topicBtnText"></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>
<div class="chips" id="clipChips"></div>
<div class="row">
<div class="grow">
<label for="fClip">คลิปที่ดู</label>
<input type="text" id="fClip" placeholder="เลือกด้านบน หรือพิมพ์เอง" autocomplete="off">
</div>
<div class="narrow">
<label for="fMin">นาที</label>
<input type="number" id="fMin" min="0" inputmode="numeric" placeholder="30">
</div>
</div>
<label>สรุปด้วยคำของตัวเอง 3 บรรทัด</label>
<div class="lines">
<input type="text" class="fLine" placeholder="1. คลิปนี้สอนอะไร" enterkeyhint="next" aria-label="สรุปบรรทัดที่ 1">
<input type="text" class="fLine" placeholder="2. กฎหรือจุดสังเกตบนกราฟ" enterkeyhint="next" aria-label="สรุปบรรทัดที่ 2">
<input type="text" class="fLine" placeholder="3. จะใช้ตอน backtest ยังไง" enterkeyhint="next" aria-label="สรุปบรรทัดที่ 3">
</div>
<label for="fQ">ยังไม่เข้าใจตรงไหน (ไม่บังคับ)</label>
<input type="text" id="fQ" placeholder="จดไว้ไปหาคำตอบทีหลัง" enterkeyhint="done">
<button class="btn block-btn" id="saveLog" disabled>บันทึกการเรียน</button>
<p class="hint" id="logHint">สรุปให้ครบ 3 บรรทัด ถึงจะได้แท่งเขียว</p>
</div>
</div>
<p class="sync" id="sync">กำลังโหลด…</p>
</main>
<main class="view" id="v-topics">
<div class="block" style="margin-top:4px">
<div class="panel">
<div style="display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted)"><span>ความคืบหน้า</span><span id="progText"></span></div>
<div class="progress"><i id="progBar" style="width:0"></i></div>
<ol class="topics" id="topics"></ol>
<div class="add-topic">
<input type="text" id="newTopic" placeholder="เพิ่มหัวข้อของคุณเอง" enterkeyhint="done" aria-label="เพิ่มหัวข้อ">
<button class="btn ghost small" id="addTopic">เพิ่ม</button>
</div>
</div>
</div>
</main>
<main class="view" id="v-history">
<div class="block" style="margin-top:4px">
<div class="panel" id="history"></div>
</div>
</main>
</div>
<nav class="tabs" aria-label="เมนู">
<div class="tabs-in" role="tablist">
<button class="tab" role="tab" data-view="today" aria-selected="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4v16M6 8h-1.5v7H6M6 8h1.5v7H6"/><path d="M12 6v12M12 9h-1.5v5H12M12 9h1.5v5H12"/><path d="M18 3v14M18 6h-1.5v8H18M18 6h1.5v8H18"/></svg>
วันนี้
</button>
<button class="tab" role="tab" data-view="topics" aria-selected="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
หัวข้อ
</button>
<button class="tab" role="tab" data-view="history" aria-selected="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
ประวัติ
</button>
</div>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dlg-wrap" id="dlg"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
(function(){

if(!m[dkey(d)]) d.setDate(d.getDate()-1);

function bestStreak(){

for(const k of days){
if(prev){ const [y,m,d] = prev.split("-").map(Number); cur = dkey(new Date(y,m-1,d+1)) === k ? cur+1 : 1; }
else cur = 1;
best = Math.max(best,cur); prev = k;
}
return best;
}

checkForm(); persist(); renderAll();
$("scroll").scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
toast(first ? `ได้แท่งเขียววันนี้แล้ว ติดต่อกัน ${streak()} วัน` : "บันทึกแล้ว");
});
$("history").addEventListener("click",e=>{
const id = e.target.closest("[data-del]")?.dataset.del; if(!id) return;
ask("ลบบันทึกนี้?", "ลบบันทึก", ()=>{
state.logs = state.logs.filter(l=>l.id!==id);
persist(); renderAll(); toast("ลบบันทึกแล้ว");
});
});
$("topics").addEventListener("click",e=>{ const b = e.target.closest("[data-id]"); if(b) openSheet("edit", b.dataset.id); });
function addTopic(){
const inp = $("newTopic"), v = inp.value.trim(); if(!v) return;
state.topics.push({id:uid(), title:v, status:"todo", links:[], summary:""});
inp.value=""; inp.blur(); persist(); renderAll(); toast("เพิ่มหัวข้อแล้ว");
}
$("addTopic").addEventListener("click",addTopic);
$("newTopic").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addTopic(); } });
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
document.addEventListener("wheel",e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change",renderHero);
new MutationObserver(renderHero).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderAll();
if(mig.changed) persist();
syncEl.textContent = "ข้อมูลบันทึกไว้ในเครื่องนี้";
(async ()=>{
try{
if(!window.claude || typeof window.claude.use !== "function") return;
const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
if(!db || !user) return;
const id = await user.id(); if(!id) return;
ref = db.collection("data/users/"+id).doc("tracker");
const snap = await ref.get();
if(snap.exists && valid(snap.data())){
const m = migrate(JSON.parse(JSON.stringify(snap.data())));
state = m.s;
try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
renderAll(); if(sheetKind) renderSheet();
if(m.changed) persist();
} else {
await ref.set(JSON.parse(JSON.stringify(state)));
}
syncEl.textContent = SYNC_OK;
}catch(e){ ref = null; syncEl.textContent = "ข้อมูลบันทึกไว้ในเครื่องนี้"; }
})();
})();
</script>
</body>
</html>
