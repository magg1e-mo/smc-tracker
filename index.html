<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>SMC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
color-scheme:light dark;
--acc:#1F8A70; --acc-l:color-mix(in srgb,var(--acc),#fff 38%);
--blur:18px; --danger:#B4452F;
--display:"Kanit",system-ui,sans-serif;
--body:"Kanit","Noto Sans Thai",-apple-system,system-ui,sans-serif;
--tabh:66px;
--bg:#FFFFFF;--ink:#064E3B;--muted:#115E48;--faint:#3F7F6A;--tabm:#14614A;--line:rgba(6,78,59,.16);--axis:rgba(6,78,59,.2);--link:#0B6B4F;--hover:#064E3B;--gold:#8A6410;--zero:rgba(6,78,59,.35);--miss:rgba(6,78,59,.24);--grab:rgba(6,78,59,.25);--w:#fff;--hi:rgba(255,255,255,.5);--hi2:rgba(255,255,255,.45);--inset:rgba(255,255,255,.7);--inset2:rgba(255,255,255,.25);--edge:color-mix(in oklch,var(--acc) 60%,#fff);--edge-s:color-mix(in oklch,var(--acc) 42%,#fff);--edge-b:color-mix(in oklch,var(--acc) 55%,#fff);--sh:color-mix(in srgb,var(--acc) 26%,transparent);--sh-b:color-mix(in srgb,var(--acc) 34%,transparent);--sh-s:color-mix(in srgb,var(--acc) 22%,transparent);--sh-x:color-mix(in srgb,var(--acc) 28%,transparent);--fill:rgba(255,255,255,.95);--fill-f:#fff;--fill-inset:color-mix(in srgb,var(--acc) 14%,transparent);--ring:color-mix(in srgb,var(--acc) 22%,transparent);--chip:rgba(255,255,255,.88);--chip-on:color-mix(in oklch,var(--acc) 22%,#fff);--ghost:rgba(255,255,255,.9);--ghost-edge:color-mix(in oklch,var(--acc) 45%,#fff);--track:rgba(255,255,255,.95);--scrim:rgba(8,40,30,.38);--sheet-t:color-mix(in oklch,var(--acc) 36%,rgba(255,255,255,.94));--sheet-b:rgba(255,255,255,.97);--bar-a:color-mix(in oklch,var(--acc) 52%,rgba(255,255,255,.62));--bar-b:color-mix(in oklch,var(--acc) 40%,rgba(255,255,255,.58));--bub-a:rgba(255,255,255,.98);--bub-b:rgba(255,255,255,.8);--bub-sh:rgba(14,84,62,.22);--toast:linear-gradient(180deg,rgba(13,43,34,.9),rgba(13,43,34,.8));--toast-c:#F2FBF6;--acc-d:color-mix(in srgb,var(--acc),#000 32%);--g1:color-mix(in oklch,var(--acc) 40%,#fff);--g2:color-mix(in oklch,var(--acc) 30%,#fff);--g3:color-mix(in oklch,var(--acc-l) 34%,#fff);--s1:color-mix(in oklch,var(--acc) 48%,#fff);--s2:color-mix(in oklch,var(--acc) 36%,#fff);--bw:1.5px;--head:#0D2B22;--label:#0D2B22;
}
@media (prefers-color-scheme: dark){:root{--bg:#09130F;--ink:#E4F3EC;--muted:#9BBBAE;--faint:#6B8A7D;--tabm:#86A89A;--line:rgba(255,255,255,.08);--axis:rgba(255,255,255,.12);--link:#5FD9B2;--hover:#8CF0CE;--gold:#E3B94F;--zero:rgba(255,255,255,.28);--miss:rgba(255,255,255,.16);--grab:rgba(255,255,255,.2);--w:#0E1B16;--hi:rgba(255,255,255,.1);--hi2:rgba(255,255,255,.08);--inset:rgba(255,255,255,.14);--inset2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.1);--edge-s:rgba(255,255,255,.09);--edge-b:rgba(255,255,255,.14);--sh:rgba(0,0,0,.45);--sh-b:rgba(0,0,0,.5);--sh-s:rgba(0,0,0,.3);--sh-x:rgba(0,0,0,.55);--fill:rgba(255,255,255,.06);--fill-f:rgba(255,255,255,.1);--fill-inset:rgba(0,0,0,.35);--ring:color-mix(in srgb,var(--acc) 40%,transparent);--chip:rgba(255,255,255,.05);--chip-on:color-mix(in srgb,var(--acc) 26%,#0E1B16);--ghost:rgba(255,255,255,.07);--ghost-edge:rgba(255,255,255,.14);--track:rgba(255,255,255,.1);--scrim:rgba(0,0,0,.6);--sheet-t:color-mix(in srgb,var(--acc) 20%,rgba(18,32,27,.92));--sheet-b:rgba(14,26,21,.94);--bar-a:color-mix(in srgb,var(--acc) 22%,rgba(16,30,25,.7));--bar-b:color-mix(in srgb,var(--acc-l) 10%,rgba(14,26,21,.68));--bub-a:rgba(255,255,255,.2);--bub-b:rgba(255,255,255,.07);--bub-sh:rgba(0,0,0,.4);--toast:linear-gradient(180deg,rgba(228,243,236,.96),rgba(206,230,219,.92));--toast-c:#0D2B22;--acc-d:color-mix(in srgb,var(--acc-l),#fff 12%);--g1:color-mix(in srgb,var(--acc) 20%,var(--w));--g2:color-mix(in srgb,var(--acc) 9%,var(--w));--g3:color-mix(in srgb,var(--acc-l) 16%,var(--w));--s1:color-mix(in srgb,var(--acc) 17%,var(--w));--s2:color-mix(in srgb,var(--acc-l) 9%,var(--w));--bw:1px;--head:var(--ink);--label:var(--muted);--danger:#E07A63}}
*,*::before,*::after{box-sizing:border-box;scrollbar-width:none;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y}
body{color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.55;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
button,input,textarea{font:inherit;color:inherit;font-size:16px}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--link)}
input::placeholder,textarea::placeholder{color:var(--faint)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{max-width:100%}
.glass{background:linear-gradient(125deg,var(--hi) 0%,transparent 36%),linear-gradient(165deg,var(--g1) 0%,var(--g2) 58%,var(--g3) 100%);border:var(--bw) solid var(--edge);box-shadow:0 10px 24px var(--sh),inset 0 1px 0 var(--inset),inset 0 -1px 0 var(--inset2)}
.glass-b{background:linear-gradient(125deg,var(--hi2) 0%,transparent 36%),linear-gradient(165deg,var(--bar-a) 0%,var(--bar-b) 100%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:var(--bw) solid var(--edge-b);box-shadow:0 12px 30px var(--sh-b),inset 0 1px 0 var(--inset),inset 0 -1px 0 var(--inset2)}
.glass-s{background:linear-gradient(125deg,var(--hi2) 0%,transparent 42%),linear-gradient(150deg,var(--s1),var(--s2));border:var(--bw) solid var(--edge);box-shadow:0 6px 14px var(--sh-s),inset 0 1px 0 var(--inset)}
.glass-x{background:linear-gradient(180deg,var(--sheet-t) 0%,var(--sheet-b) 38%);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border-top:1px solid var(--edge-b);box-shadow:0 -12px 40px var(--sh-x),inset 0 1px 0 var(--inset)}
.glass-d{background:var(--toast);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 28px rgba(8,40,30,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.field,input[type=text],input[type=email],input[type=password],input[type=number],textarea{background:var(--fill);border:var(--bw) solid var(--edge-s);box-shadow:inset 0 2px 5px var(--fill-inset);transition:box-shadow .25s,border-color .25s,background .25s}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;border-radius:16px;padding:11px 14px;min-height:48px;-webkit-appearance:none;appearance:none;color:var(--ink)}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=number]:focus,textarea:focus,.field:focus{outline:none;background:var(--fill-f);border-color:var(--acc);box-shadow:0 0 0 4px var(--ring),inset 0 2px 6px rgba(14,84,62,.06)}
textarea{resize:none;min-height:112px}
.press{transition:transform .18s cubic-bezier(.3,1.5,.5,1),background .25s,border-color .25s}
.press:active{transform:scale(.96)}
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:430px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:431px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -14px;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 8px}
.top h1{font-size:26px;font-weight:600;line-height:1.15;letter-spacing:-.01em;color:var(--head)}
.streak{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;animation-delay:120ms}
.streak svg{stroke:var(--acc-d)}
.streak b{font-family:var(--display);font-size:30px;line-height:1;color:var(--head);font-weight:700}
.streak span{font-size:11px;color:var(--label);line-height:1.15}
.streak.zero svg{stroke:var(--zero)}
.view{display:none}
.view.active{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.view h2{font-size:18px;font-weight:500;margin:6px 4px 0}
.panel{border-radius:26px;padding:16px}
.chart{padding:14px 12px 10px}
.bars{height:118px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--axis);padding:0 2px}
.bars .cd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars.no-anim .cn{animation:none}
.chart-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);padding-top:6px}
.chart-foot .now{display:flex;align-items:center;gap:7px}
.pingdot{position:relative;width:8px;height:8px;display:block}
.pingdot i{position:absolute;inset:0;border-radius:50%;background:var(--acc)}
.legend{color:var(--muted);font-size:12px;margin:-6px 2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:18px;padding:11px 14px;display:flex;flex-direction:column}
.stat strong{font-family:var(--display);font-size:24px;font-weight:600}
.stat:first-child strong{color:var(--acc-d)}
.stat span{color:var(--muted);font-size:12px}
.today-state{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--head)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--miss);flex:none;transition:background .3s,box-shadow .3s}
.done .dot{background:var(--acc);box-shadow:0 0 10px var(--acc)}
label,.lbl{display:block;font-size:13px;color:var(--label);margin:14px 0 6px}
.picker{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;border-radius:16px;padding:8px 14px;text-align:left;font-size:15px;color:var(--ink)}
.picker svg{flex:none;color:var(--muted)}
.lines input{margin-bottom:8px}
.row{display:flex;gap:10px}
.row>.grow{flex:1;min-width:0}
.row>.narrow{flex:0 0 88px}
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;min-height:48px;padding:0 18px;color:#fff;font-weight:500;background:linear-gradient(180deg,var(--acc-l),var(--acc));box-shadow:0 8px 18px color-mix(in srgb,var(--acc) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.08);transition:transform .18s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.block-btn{width:100%;margin-top:16px;min-height:54px;border-radius:18px;font-size:17px}
.btn.block-btn:not(:disabled)::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-70%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out 1s infinite}
.btn.ghost{background:var(--ghost);color:var(--ink);border:1px solid var(--ghost-edge);box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#D8745E,var(--danger))}
.btn.small{min-height:46px;font-size:15px;padding:0 16px}
.linkbtn{background:none;border:0;color:var(--link);text-decoration:underline;padding:6px 4px;min-height:32px;font-size:12px;font-weight:400}
.auth-err{color:var(--danger);font-size:13px;min-height:20px;margin:8px 0 0}
.hint{color:var(--muted);font-size:12px;margin:8px 0 0;text-align:center}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chips:empty{display:none}
.chips .cap{font-size:12px;color:var(--label)}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--chip);border:1px solid var(--edge-s);border-radius:16px;padding:6px 12px;min-height:46px;font-size:13px;transition:background .3s,border-color .3s}
.chip.on{border-color:var(--acc);background:var(--chip-on)}
.chip .ck{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);transition:background .3s,border-color .3s}
.chip.watched .ck{background:var(--acc);border-color:var(--acc)}
.chip .open{margin-left:auto;color:var(--link);font-size:12px;flex:none;font-weight:400}
.progress{height:8px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px color-mix(in srgb,var(--acc) 22%,transparent);overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc-l),var(--acc));transform-origin:left;animation:growX .9s cubic-bezier(.2,.9,.3,1) .2s both;transition:width .6s cubic-bezier(.2,.9,.3,1)}
ol.topics,.pick-list{list-style:none;padding:0;margin:0}
.topic{border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic-head,.pick-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 2px;min-height:60px;text-align:left}
.pick-list{margin-top:4px}
.pick-list li+li .pick-row{border-top:1px solid var(--line)}
.pick-row{min-height:58px}
.pick-row.on .t-title{color:var(--acc-d);font-weight:600}
.pick-row svg{flex:none;color:var(--link)}
.num{font-family:var(--display);font-weight:600;width:24px;color:var(--muted);flex:none;text-align:right}
.is-done .num,.is-done .t-meta{color:var(--acc-d)}
.is-learning .num,.is-learning .t-meta{color:var(--gold)}
.t-main{flex:1;min-width:0}
.t-title{display:block;font-weight:400;font-size:15px}
.is-done .t-title{color:var(--muted)}
.t-meta{display:block;font-size:12px;color:var(--muted)}
.chev{flex:none;color:var(--faint)}
.add-topic{display:flex;gap:8px;margin:8px 0 8px}
.add-topic input{flex:1;min-width:0}
.day h3{font-size:14px;font-weight:500;color:var(--muted);margin-bottom:10px}
.day+.day{margin-top:16px}
.entry{border-radius:18px;padding:10px 6px 10px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:2px}
.entry .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.entry ol{margin:2px 0 0;padding-left:18px;font-size:14px}
.entry .q{font-size:13px;color:var(--gold)}
.entry a{word-break:break-all;font-size:13px}
.x{background:none;border:0;color:var(--faint);min-width:44px;min-height:44px;font-size:22px}
.empty{color:var(--muted);text-align:center;padding:20px 6px;margin:0;font-size:13px;line-height:1.5}
.sync{font-size:12px;color:var(--muted);margin:10px 8px 0;text-align:center}
.tabs{position:absolute;z-index:5;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:var(--tabh);border-radius:33px;padding:6px}
.bubble{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 3);border-radius:27px;background:linear-gradient(180deg,var(--bub-a),var(--bub-b));box-shadow:0 6px 16px var(--bub-sh),inset 0 1px 0 var(--inset),inset 0 -1px 0 color-mix(in srgb,var(--acc) 25%,transparent);transition:transform .55s cubic-bezier(.34,1.5,.64,1)}
.tabs-in{position:relative;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--tabm);font-size:12px;font-weight:300;transition:color .3s}
.tab svg{width:24px;height:24px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.tab[aria-selected="true"]{color:var(--acc-d);font-weight:500}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.14)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;border-radius:30px 30px 0 0;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
padding:8px 18px calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .55s cubic-bezier(.22,1.08,.36,1),visibility 0s linear .55s}
.sheet.show{transform:translateY(0);visibility:visible;transition-delay:0s}
.grab{width:38px;height:5px;border-radius:99px;background:var(--grab);margin:4px auto 10px}
.sheet h3{font-size:20px;font-weight:500;padding-right:44px;line-height:1.3}
.sheet .close{position:absolute;top:10px;right:10px}
.sheet .status{font-size:13px;color:var(--muted)}
.links{margin:0;padding:0;list-style:none}
.links li{display:flex;gap:6px;align-items:center;font-size:14px;border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.links a,.links span{flex:1;min-width:0;word-break:break-all;padding:10px 0}
.clips{display:flex;flex-direction:column;gap:16px;margin-top:2px}
.clip{position:relative}
.clip a{display:block;text-decoration:none;color:var(--ink)}
.clip-thumb{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--s1),var(--g2));border:var(--bw) solid var(--edge);box-shadow:0 8px 18px var(--sh-s)}
.clip-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.clip-play{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.clip-play svg{margin-left:3px}
.clip-seen{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:99px;background:rgba(255,255,255,.92);color:#0B6B4F;font-size:12px;font-weight:500}
.clip-dur{position:absolute;right:10px;bottom:10px;padding:2px 8px;border-radius:8px;background:rgba(8,24,18,.78);color:#fff;font-size:12px;font-weight:400}
.clip-title{margin:8px 4px 0;font-size:14px;font-weight:400;line-height:1.35}
.clip-x{position:absolute;right:4px;top:4px;width:44px;height:44px;background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.clip-x span{width:30px;height:30px;border-radius:50%;background:rgba(8,24,18,.62);color:#fff;font-size:18px;line-height:30px;text-align:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.dlg-wrap{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:24px}
.dlg-wrap.show{display:flex;animation:fade .25s ease both}
.dlg{width:100%;max-width:320px;border-radius:26px;padding:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 14%,var(--w)),var(--w) 60%);box-shadow:0 20px 50px rgba(8,40,30,.3),inset 0 1px 0 var(--inset);animation:rise .4s cubic-bezier(.3,1.4,.5,1) both}
.dlg p{margin:0 0 16px}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:absolute;left:50%;bottom:calc(var(--tabh) + 36px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.6);z-index:40;color:var(--toast-c);padding:11px 18px;border-radius:16px;opacity:0;transition:opacity .25s,transform .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.rise{animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.glow{animation:rise .6s cubic-bezier(.2,.9,.3,1) both,breathe 3.2s ease-in-out .8s infinite}
.cn{transform-origin:bottom;animation:grow .75s cubic-bezier(.3,1.4,.5,1) both}
.ping{animation:ping 2.2s ease-out infinite}
.tw{position:relative;white-space:pre;animation:twIn .01s steps(1,end) both;animation-delay:var(--d,0ms)}
.tw-bang{display:inline-block;color:var(--acc-d);transform-origin:50% 100%;animation:twIn .01s steps(1,end) both,bang .85s cubic-bezier(.3,1.5,.5,1) both,hop 5.5s ease-in-out infinite;animation-delay:var(--d,0ms),var(--d,0ms),calc(var(--d,0ms) + 2.4s)}
@keyframes twIn{from{opacity:0}to{opacity:1}}
@keyframes bang{0%{transform:translateY(-22px) scale(.6)}38%{transform:translateY(0) scale(1.3,.72)}58%{transform:translateY(-8px) scale(.94,1.12)}78%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes hop{0%,100%{transform:none}5%{transform:translateY(-6px) scale(.96,1.08)}10%{transform:translateY(0) scale(1.08,.9)}15%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.8);opacity:0}}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
const LS_KEY = "smc-tracker-v1";
const STATE_V = 2;
const SEED = [["Market Structure พื้นฐาน (HH, HL, LH, LL)",["EP.01 Bullish Trend (15:54) https://youtu.be/QFzrW-CYs9o","EP.02 Bearish Trend (13:47) https://youtu.be/ntFPB44EPdM","เปิดกราฟมาควรเริ่มหาโครงสร้างจากตรงไหนดี (29:54) https://youtu.be/EI17HjyeIos"]],["BOS และ CHoCH",["EP.03 BOS + CHoCH (13:57) https://youtu.be/r1pur3CQ0Eo","แกะวิธีคิดรายใหญ่: CHoCH จริงหรือหลอกใน LTF (2:35:46, เสริม) https://youtu.be/lCbO1mJrSFg"]],["Order Block",["Bullish Order Block (12:36) https://youtu.be/o-Kgkd-9VWg","Bearish Order Block (10:07) https://youtu.be/gfK8kvws504","ทำไมบางกราฟมาไม่ถึงโซน Order Block (15:04) https://youtu.be/MnBGtTO_bII","Order Block Inside Bar (21:51) https://youtu.be/QWJey-tE3yg"]],["Premium / Discount",["Fibonacci Retracement ใช้ยังไงให้ได้ผล (26:53) https://youtu.be/YVBClvqupec"]],["Entry Model และ Risk Management",["Aggressive Entry vs Confirmation Entry (15:44) https://youtu.be/Qy3e16gN5gg","ตกรถจังหวะแรก ควรเข้าที่ไหนดี (31:09) https://youtu.be/iDLgHiV9gJE","วิธีแก้ไม้ใน Low Time Frame (22:41) https://youtu.be/iy3g9ZEeNTU","เทรด SMC ยังไงไม่ให้แพ้บ่อย (30:32) https://youtu.be/SHq5ENt18xA","Indicator คำนวณ Lot (8:49) https://youtu.be/0fMn-n7wFEA"]],["Mitigation และ Breaker Block",["Hidden Base Zone (19:35) https://youtu.be/n7skwQ8XPV8","Breaker Block (18:39) https://youtu.be/C0cdj9TJx6I"]],["Swing Structure กับ Internal Structure",["Q&A EP.01 ถ้าเจอ Swing กว้าง เข้าออเดอร์ยังไง (44:02) https://youtu.be/3UOQ7zdAPZg","Market Structure & Inducement 2024 (45:21) https://youtu.be/h_Vwpf1OYUI"]],["Inducement และ Liquidity Sweep",["Inducement หรือ CHoCH ดูยังไงไม่ให้สับสน (39:00) https://youtu.be/__n_Q9OAWR4","3 Step Trade Liquidity Sweep https://youtu.be/YLMAu6sM7ds","Sweep Liquidity Entry Model https://youtu.be/34tivUiaf1w"]],["Multi-timeframe: HTF bias สู่ LTF entry",["5 Step High Time Frame (22:34) https://youtu.be/WKUkA4UqROM","4 Step Low Time Frame (14:25) https://youtu.be/t5jEINcfCsM","Multi-Timeframe Confirmation 2 Timeframe (21:49) https://youtu.be/WSQmt6iXcqs"]],["Liquidity (BSL, SSL, Equal High/Low)",["Liquidity EP.01 สภาพคล่องคืออะไร (21:34) https://youtu.be/dnhipnkbPbI","Liquidity EP.02 มองสภาพคล่องออก ลดโอกาสโดนกิน (20:50) https://youtu.be/W2piNWDCW0U"]],["Session และ Killzone (เอเชีย ลอนดอน นิวยอร์ก)",["New York Session คอนเฟิร์ม M1 เวลาไหนปลอดภัย https://youtu.be/QL76JbJOGoY","Liquidity Asia Session (ชอบเทรดทองห้ามมองข้าม) https://youtu.be/ZQur1BtiKjM"]],["ดูตัวอย่างเทรดจริง: Trade Breakdown ทองคำ",["EP.04 BUY XAUUSD +8.3RR https://youtu.be/USjIWm-jnN4","EP.08 SELL XAUUSD +12RR https://youtu.be/mImFdmk0p1I","EP.09 SELL XAUUSD สวนโครงสร้าง +11RR https://youtu.be/B5_9D6a8fCY","EP.11 BUY XAUUSD +12RR https://youtu.be/2cuYMkUs3FY","EP.14 SELL XAUUSD +42RR https://youtu.be/z3v_rZf0YOA"]]];
const DROPPED = ["Strong / Weak High-Low","Fair Value Gap (FVG)"];
const CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dkey(new Date());
const thMonths = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thDays = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
function fmtDate(k, withDay){
const [y,m,d] = k.split("-").map(Number);
const dt = new Date(y,m-1,d);
return (withDay ? "วัน"+thDays[dt.getDay()]+" " : "") + d+" "+thMonths[m-1];
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function parseLink(s){ const m = String(s||"").match(/https?:\/\/\S+/); const url = m ? m[0] : ""; const label = (url ? s.replace(url,"") : s).trim(); return {url, label: label || url}; }
function linkHtml(s){ const {url,label} = parseLink(s); return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>` : `<span>${esc(label)}</span>`; }
function freshState(){
return { v:STATE_V, topics: SEED.map(s => ({id:uid(), title:s[0], status:"todo", links:s[1].slice(), summary:""})), logs:[] };
}
function valid(s){ return s && Array.isArray(s.topics) && Array.isArray(s.logs); }
function migrate(s){
if(!valid(s)) return {s:freshState(), changed:true};
if((s.v||1) >= STATE_V) return {s, changed:false};
const used = new Set(s.logs.map(l=>l.topicId));
const byTitle = new Map(s.topics.map(t=>[t.title,t]));
const out = [], taken = new Set();
for(const [title,links] of SEED){
const t = byTitle.get(title);
if(t){ if(!t.links.length) t.links = links.slice(); taken.add(t.id); out.push(t); }
else out.push({id:uid(), title, status:"todo", links:links.slice(), summary:""});
}
for(const t of s.topics){
if(taken.has(t.id)) continue;
if(DROPPED.includes(t.title) && t.status==="todo" && !used.has(t.id) && !t.summary && !t.links.length) continue;
out.push(t);
}
s.topics = out; s.v = STATE_V;
return {s, changed:true};
}
let state;
try { state = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){ state = null; }
const mig = migrate(state); state = mig.s;
let ref = null, saveTimer = null, fb = null, fbTimer = null;
const syncEl = $("sync");
const SYNC_OK = "บันทึกไว้ในบัญชีของคุณ เปิดจากเครื่องไหนก็เห็นข้อมูลเดียวกัน";
function persist(touch){
if(touch !== false) state.u = Date.now();
try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
fbPushSoon();
if(!ref) return;
clearTimeout(saveTimer);
saveTimer = setTimeout(async () => {
try { await ref.set(JSON.parse(JSON.stringify(state))); syncEl.textContent = SYNC_OK; }
catch(e){ syncEl.textContent = "บันทึกขึ้นบัญชีไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้ ลองรีเฟรชหน้าอีกครั้ง"; }
}, 600);
}
function toast(msg){
const t = $("toast");
t.textContent = msg; t.classList.add("show");
clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function logsByDay(){
const m = {};
for(const l of state.logs){ (m[l.date] ||= []).push(l); }
return m;
}
function streak(){
const m = logsByDay(), d = new Date();
if(!m[dkey(d)]) d.setDate(d.getDate()-1);
let n = 0;
while(m[dkey(d)]){ n++; d.setDate(d.getDate()-1); }
return n;
}
function bestStreak(){
const days = Object.keys(logsByDay()).sort();
let best = 0, cur = 0, prev = null;
for(const k of days){
if(prev){ const [y,m,d] = prev.split("-").map(Number); cur = dkey(new Date(y,m-1,d+1)) === k ? cur+1 : 1; }
else cur = 1;
best = Math.max(best,cur); prev = k;
}
return best;
}
const statusText = {todo:"ยังไม่เริ่ม", learning:"กำลังเรียน", done:"จบแล้ว"};
const lineCount = s => (s||"").split("\n").filter(x=>x.trim()).length;
function sessionCount(id){ return state.logs.filter(l=>l.topicId===id).length; }
let formTopic = null;
function curTopicId(){
if(formTopic && state.topics.some(t=>t.id===formTopic)) return formTopic;
const n = state.topics.find(t=>t.status==="learning") || state.topics.find(t=>t.status!=="done") || state.topics[0];
return n ? n.id : "";
}
let replay = true;
function renderHero(){
const s = streak();
const st = $("streak");
st.className = "streak glass " + (s ? "glow" : "zero rise");
st.querySelector("b").textContent = s;
const m = logsByDay();
const N = 30;
const start = new Date(); start.setDate(start.getDate() - (N-1));
$("chartStart").textContent = fmtDate(dkey(start));
let bars = "";
for(let i=0;i<N;i++){
const d = new Date(start); d.setDate(start.getDate()+i);
const list = m[dkey(d)] || [];
const delay = (300 + i*24) + "ms";
if(list.length){
const mins = list.reduce((a,l)=>a+(+l.minutes||0),0);
const h = Math.round(Math.min(82, 22 + (list.length-1)*14 + Math.min(mins,120)/120*30));
bars += `<div class="cd"><div class="cn" style="width:1.5px;height:8px;background:var(--acc);animation-delay:${delay}"></div><div class="cn" style="width:7px;height:${h}px;border-radius:3px;background:linear-gradient(180deg,var(--acc-l),var(--acc));box-shadow:0 0 10px color-mix(in srgb,var(--acc) 45%,transparent);animation-delay:${delay}"></div></div>`;
} else {
const c = i === N-1 ? "#C79A2C" : "var(--miss)";
bars += `<div class="cd"><div class="cn" style="width:1.5px;height:6px;background:${i===N-1?"#C79A2C":"var(--miss)"};animation-delay:${delay}"></div><div class="cn" style="width:7px;height:3px;border-radius:3px;background:${c};animation-delay:${delay}"></div></div>`;
}
}
const box = $("candles");
box.className = "bars" + (replay ? "" : " no-anim");
box.innerHTML = bars;
const done = state.topics.filter(t=>t.status==="done").length;
const days30 = Object.keys(m).filter(k => k >= dkey(start)).length;
const totalMin = state.logs.reduce((a,l)=>a+(+l.minutes||0),0);
const rc = replay ? " rise" : "";
$("stats").innerHTML =
`<div class="stat glass-s${rc}" style="animation-delay:160ms"><strong>${done}/${state.topics.length}</strong><span>หัวข้อที่จบแล้ว</span></div>`+
`<div class="stat glass-s${rc}" style="animation-delay:220ms"><strong>${days30}</strong><span>วันที่เรียนใน 30 วัน</span></div>`+
`<div class="stat glass-s${rc}" style="animation-delay:280ms"><strong>${bestStreak()}</strong><span>สถิติติดต่อกันสูงสุด</span></div>`+
`<div class="stat glass-s${rc}" style="animation-delay:340ms"><strong>${(totalMin/60).toFixed(1)}</strong><span>ชั่วโมงเรียนรวม</span></div>`;
replay = false;
}
function renderToday(){
const has = (logsByDay()[today()]||[]).length;
const el = $("todayState");
el.className = "today-state" + (has ? " done" : "");
el.lastElementChild.textContent = has ? `วันนี้ได้แท่งเขียวแล้ว (${has} ครั้ง)` : "วันนี้ยังไม่ได้เรียน เป้าแค่ 1 คลิป";
const id = curTopicId(), t = state.topics.find(x=>x.id===id);
$("topicBtnText").textContent = t ? (state.topics.indexOf(t)+1) + ". " + t.title : "เลือกหัวข้อ";
renderChips();
}
function renderChips(){
const t = state.topics.find(x=>x.id===curTopicId());
const box = $("clipChips");
if(!t || !t.links.length){ box.innerHTML = ""; return; }
const watched = new Set(state.logs.filter(l=>l.topicId===t.id).map(l=>l.clip));
const cur = $("fClip").value.trim();

})();
const app = SDK.initializeApp(FBCFG);
fb = {SDK, auth: SDK.getAuth(app), db: SDK.getFirestore(app), user: null, ref: null, unsub: null};
setSyncLocal();
SDK.onAuthStateChanged(fb.auth, onUser);
}catch(e){ fb = null; setSyncLocal(); }
}
function renderAuth(){
$("sheet").setAttribute("aria-label","เข้าสู่ระบบ");
$("sheet").innerHTML = `
<div class="grab"></div>
<button class="x close" data-s="close" aria-label="ปิด">×</button>
<h3>ซิงก์ข้ามเครื่อง</h3>
<div class="status">ล็อกอินครั้งเดียวต่อเครื่อง ข้อมูลจะตามคุณไปทุกที่</div>
<label for="aEmail">อีเมล</label>
<input type="email" id="aEmail" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" enterkeyhint="next">
<label for="aPass">รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
<input type="password" id="aPass" autocomplete="current-password" enterkeyhint="go">
<p class="auth-err" id="aErr" role="alert"></p>
<button class="btn block-btn" id="aGo" data-s="signin">เข้าสู่ระบบ</button>
<div class="tools">
<button class="btn ghost small" data-s="signup">สร้างบัญชีใหม่</button>
<button class="btn ghost small" data-s="skip">ข้ามไปก่อน</button>
</div>`;
}
async function doAuth(mode){
if(!fb) return;
const email = $("aEmail").value.trim(), pass = $("aPass").value, err = $("aErr");
if(!email || !pass){ err.textContent = "กรอกอีเมลและรหัสผ่านก่อน"; return; }
err.textContent = "";
const go = $("aGo"); go.disabled = true;
try{
if(mode==="up") await fb.SDK.createUserWithEmailAndPassword(fb.auth, email, pass);
else await fb.SDK.signInWithEmailAndPassword(fb.auth, email, pass);
}catch(e){
const el = $("aErr"); if(el) el.textContent = AUTH_ERR[e && e.code] || "เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง";
const g = $("aGo"); if(g) g.disabled = false;
}
}
startSync();
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
document.addEventListener("wheel",e=>{ if(e.ctrlKey) e.preventDefault(); },{passive:false});
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change",renderHero);
new MutationObserver(renderHero).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
renderAll();
if(mig.changed) persist(false);
setSyncLocal();
(async ()=>{
try{
if(!window.claude || typeof window.claude.use !== "function") return;
const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
if(!db || !user) return;
const id = await user.id(); if(!id) return;
ref = db.collection("data/users/"+id).doc("tracker");
const snap = await ref.get();
if(snap.exists && valid(snap.data())){
const m = migrate(JSON.parse(JSON.stringify(snap.data())));
state = m.s;
try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
renderAll(); if(sheetKind) renderSheet();
if(m.changed) persist(false);
} else {
await ref.set(JSON.parse(JSON.stringify(state)));
}
syncEl.textContent = SYNC_OK;
}catch(e){ ref = null; setSyncLocal(); }
})();
})();
</script>
